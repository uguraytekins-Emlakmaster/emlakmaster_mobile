name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # google_fonts ^8.1 Dart >=3.9 ister; 3.35+ stable ile hizalı.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Firebase / bundle identity (repo)
        run: bash scripts/verify_firebase_identity.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Startup perf regression (automated)
        run: bash scripts/verify_startup_perf.sh
